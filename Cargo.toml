[workspace]
resolver = "3"
members = ["erpcons-account", "pi-mock"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

# Versions follow erpcons-update so the desktop apps resolve one copy of each crate.
[workspace.dependencies]
base64 = "0.23"
ed25519-dalek = "2.2"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"] }
