[package]
name = "erpcons-account"
description = "PI account client for the ERPCons Office desktop apps: sign-in, shared session, device activation, offline leases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
# Secret Service over zbus (pure Rust): Linux builds need no libdbus.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
log = "0.4"
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true

[dev-dependencies]
pi-mock = { path = "../pi-mock" }
tempfile = "3"
